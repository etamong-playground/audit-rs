name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      AUDIT_TEST_DATABASE_URL: postgres://audit:audit-test@127.0.0.1:5432/audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start disposable PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE audit LOGIN PASSWORD 'audit-test'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE audit_test OWNER audit"
      - run: cargo check --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
