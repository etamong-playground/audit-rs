[package]
name = "etamong-audit"
version = "0.1.0"
edition = "2021"
description = "Structured audit logging for Rust — one JSON line per event (actor, action, target, result) with a fresh ref token."
license = "MIT OR Apache-2.0"
repository = "https://github.com/etamong-playground/audit-rs"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
